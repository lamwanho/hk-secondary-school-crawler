name: Public school monitor

on:
  schedule:
    - cron: '15 20 * * *'
    - cron: '0 22 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: Collection depth
        required: true
        default: daily
        type: choice
        options: [daily, deep]

permissions:
  contents: write

concurrency:
  group: public-school-data
  cancel-in-progress: false

jobs:
  daily:
    if: >-
      github.repository == 'lamwanho/hk-secondary-school-crawler' &&
      github.event.repository.private == false &&
      (github.event_name == 'schedule' && github.event.schedule == '15 20 * * *' ||
       github.event_name == 'workflow_dispatch' && inputs.mode == 'daily')
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Assert exact public repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = 'lamwanho/hk-secondary-school-crawler'
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - name: Offline regression checks
        run: python -m unittest discover -s tests -v
      - name: Every school, four key pages, bounded resumable batches
        run: python scripts/run-daily.py --mode daily --batch-size 50 --workers 4 --timeout 8 --max-seconds 4500
      - name: Publish collected checkpoints once
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = 'lamwanho/hk-secondary-school-crawler'
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = false
          test -d .git || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for path in docs/data/monitor.json docs/data/monitor-state.json docs/data/monitor-history; do
            if test -e "$path"; then git add -- "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'data: daily public school monitoring'
            git push origin HEAD:main
          fi

  deeper:
    if: >-
      github.repository == 'lamwanho/hk-secondary-school-crawler' &&
      github.event.repository.private == false &&
      (github.event_name == 'schedule' && github.event.schedule == '0 22 * * 0' ||
       github.event_name == 'workflow_dispatch' && inputs.mode == 'deep')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Assert exact public repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = 'lamwanho/hk-secondary-school-crawler'
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - name: Offline regression checks
        run: python -m unittest discover -s tests -v
      - name: Rotating historical and deeper sources, twelve pages per school
        run: python scripts/run-daily.py --mode deep --batch-size 50 --workers 4 --timeout 8 --max-seconds 2700
      - name: Publish collected checkpoints once
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = 'lamwanho/hk-secondary-school-crawler'
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = false
          test -d .git || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for path in docs/data/monitor.json docs/data/monitor-state.json docs/data/monitor-history; do
            if test -e "$path"; then git add -- "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'data: weekly deeper public school monitoring'
            git push origin HEAD:main
          fi
